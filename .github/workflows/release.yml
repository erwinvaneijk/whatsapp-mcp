name: Release

# Builds whatsapp-mcp for every release platform (docs/archive/rust-1.0/plan.md,
# phase 6) and, on a v* tag, attaches the binaries and SHA256SUMS to a draft
# GitHub release, to be checked and published by hand. A pull request that
# changes this file, or the "Run workflow" button, builds without releasing.

on:
  push:
    tags: ["v*"]
  pull_request:
    branches: [main, dev-main]
    paths: [.github/workflows/release.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux on 22.04, so the binaries need glibc 2.35 or newer only,
          # not the newest runner's.
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-22.04 }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-22.04-arm }
          - { target: x86_64-apple-darwin, os: macos-15-intel }
          - { target: aarch64-apple-darwin, os: macos-15 }
          - { target: x86_64-pc-windows-msvc, os: windows-latest }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6

      - name: Install the pinned toolchain
        run: rustup toolchain install

      - name: Build
        run: cargo build --release --locked

      # The binary must run, and on a tag report the tag's version.
      - name: Check the version
        run: |
          version=$(target/release/whatsapp-mcp --version)
          echo "$version"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            test "$version" = "whatsapp-mcp ${GITHUB_REF_NAME#v}"
          fi

      - name: Name the binary
        env:
          TARGET: ${{ matrix.target }}
        run: |
          mkdir dist
          if [[ "$TARGET" == *windows* ]]; then
            cp target/release/whatsapp-mcp.exe "dist/whatsapp-mcp-$TARGET.exe"
          else
            cp target/release/whatsapp-mcp "dist/whatsapp-mcp-$TARGET"
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: whatsapp-mcp-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Draft release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: |
          sha256sum whatsapp-mcp-* > SHA256SUMS
          cat SHA256SUMS
          test "$(wc -l < SHA256SUMS)" -eq 5

      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" dist/*
          --repo "$GITHUB_REPOSITORY" --draft --verify-tag
          --title "$GITHUB_REF_NAME"
          --notes "See [CHANGELOG.md](https://github.com/$GITHUB_REPOSITORY/blob/$GITHUB_REF_NAME/CHANGELOG.md)."
