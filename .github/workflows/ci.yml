name: CI

on:
  push:
    branches: [main, dev-main, "fix/**", "feat/**", "ci/**"]
  pull_request:
    branches: [main, dev-main]
  workflow_dispatch: # "Run workflow" button on the Actions tab

jobs:
  go:
    name: Go build, vet and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: whatsapp-bridge
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: whatsapp-bridge/go.mod
          cache-dependency-path: whatsapp-bridge/go.sum

      - name: Build
        run: go build -v ./...

      - name: Vet
        run: go vet ./...

      # Both builds must work: full-text search is optional (see README).
      - name: Test without FTS5
        run: go test -timeout 120s ./...

      - name: Test with FTS5
        run: go test -tags sqlite_fts5 -timeout 300s ./...

  python:
    name: Python lint and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: whatsapp-mcp-server
    steps:
      - uses: actions/checkout@v6

      - name: Set up uv
        uses: astral-sh/setup-uv@v7

      # Uses the versions pinned in uv.lock (Python 3.11+, mcp 2.x, ruff).
      - name: Check formatting
        run: uv run --locked ruff format --check --diff

      - name: Lint
        run: uv run --locked ruff check --output-format=github

      - name: Run tests
        env:
          PYTHONPATH: .
        run: uv run --locked --with pytest pytest -v tests

  # Rust workspace (docs/rust-1.0/plan.md, phase 2). Every release platform
  # builds, lints and tests here; the toolchain comes from rust-toolchain.toml.
  rust:
    name: Rust (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Linux x86_64, os: ubuntu-latest }
          - { name: Linux arm64, os: ubuntu-24.04-arm }
          # Pinned images: macos-latest (macOS 26) often waits for a runner
          # long enough for the job to be cancelled.
          - { name: macOS arm64, os: macos-15 }
          - { name: macOS x86_64, os: macos-15-intel }
          - { name: Windows x86_64, os: windows-latest }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6

      - name: Install the pinned toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        if: matrix.os == 'ubuntu-latest'
        run: cargo fmt --all --check

      - name: Lint
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --locked

      - name: Build release binary
        run: cargo build --release --locked

      - name: Run the binary
        run: target/release/whatsapp-mcp --version

  rust-deny:
    name: Rust dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # Runs on the runner, not in the cargo-deny container, so it uses the
      # toolchain pinned in rust-toolchain.toml.
      - name: Install the pinned toolchain
        run: rustup toolchain install

      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny

      # Vulnerabilities (RustSec), licenses, duplicate crates and sources;
      # see deny.toml.
      - name: Check dependencies
        run: cargo deny --locked check

  parity:
    name: Parity harness
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: parity
    steps:
      - uses: actions/checkout@v6

      - name: Set up uv
        uses: astral-sh/setup-uv@v7

      - name: Check formatting
        run: uv run --locked ruff format --check --diff

      - name: Lint
        run: uv run --locked ruff check --output-format=github

      # Runs the Python MCP server against the test data and compares every
      # result with the golden files (see parity/README.md).
      - name: Compare with golden files
        run: uv run --locked python run.py

      # The Rust server (phase 4) must match the same golden files. It is
      # checked for what it implements so far; the list grows with each step.
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - name: Build the Rust server
        run: cargo build --locked --package whatsapp-mcp

      - name: Compare the Rust server with golden files
        run: uv run --locked python run.py --server rust --only _server
