name: Plugin

# The Claude Code plugin in plugin/ (docs/plugin/plan.md): the manifest is
# valid, and the launcher downloads the pinned release binary, checks it,
# runs it, and refuses one with a wrong checksum, on every platform; and
# the evals in plugin/evals pass, with mocked WhatsApp tools.

on:
  push:
    branches: [main, dev-main]
    paths: ["plugin/**", ".claude-plugin/**", ".github/workflows/plugin.yml"]
  pull_request:
    branches: [main, dev-main]
    paths: ["plugin/**", ".claude-plugin/**", ".github/workflows/plugin.yml"]
  workflow_dispatch:

jobs:
  validate:
    name: Validate manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Install Claude Code
        run: npm install --global @anthropic-ai/claude-code@2.1.311
      - name: Validate the plugin
        run: claude plugin validate plugin --strict
      - name: Validate the marketplace
        run: claude plugin validate . --strict

  evals:
    name: Evals
    runs-on: ubuntu-latest
    env:
      # Without the secret (forks, or before it is set) the job is skipped.
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v6
        if: env.ANTHROPIC_API_KEY != ''
      - uses: actions/setup-node@v6
        if: env.ANTHROPIC_API_KEY != ''
        with:
          node-version: 22
      - name: Install Claude Code
        if: env.ANTHROPIC_API_KEY != ''
        run: npm install --global @anthropic-ai/claude-code@2.1.311
      - name: Run the evals
        if: env.ANTHROPIC_API_KEY != ''
        working-directory: plugin
        # Mocked tools only: no WhatsApp account, and the real server is not
        # started. With the plugin only (no baseline arm), within $3.
        run: >-
          claude plugin eval . --trust-plugin --no-scaffold --no-publish
          --ablation none --concurrency 3 --max-cost-usd 3
      - uses: actions/upload-artifact@v7
        if: always() && env.ANTHROPIC_API_KEY != ''
        with:
          name: plugin-evals
          path: plugin/evals/results/
      - name: Skipped
        if: env.ANTHROPIC_API_KEY == ''
        run: echo "::notice::Plugin evals skipped; set the ANTHROPIC_API_KEY secret to run them."

  launcher:
    name: Launcher (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6

      - name: Downloads, checks and runs the pinned binary
        run: |
          export CLAUDE_PLUGIN_DATA="$RUNNER_TEMP/data"
          version="$(sed -n 's/^VERSION="\(.*\)"$/\1/p' plugin/scripts/launch.sh)"
          out="$(bash plugin/scripts/launch.sh --version)"
          test "$out" = "whatsapp-mcp $version"
          # A second start uses the file it already has.
          ! bash plugin/scripts/launch.sh --version 2>&1 | grep downloading

      - name: Refuses a binary with a wrong checksum
        run: |
          export CLAUDE_PLUGIN_DATA="$RUNNER_TEMP/tampered"
          # In the checkout: on Windows $RUNNER_TEMP is a D:\ path, which
          # bash does not take as a folder.
          release="$PWD/fake-release"
          mkdir -p "$release"
          while read -r _ f; do
            printf 'not the release\n' > "$release/$f"
          done < plugin/scripts/SHA256SUMS
          base="file://$release"
          if [ "${RUNNER_OS}" = "Windows" ]; then base="file:///$(cygpath -m "$release")"; fi
          if WHATSAPP_MCP_DOWNLOAD_URL="$base" bash plugin/scripts/launch.sh --version 2> err.txt; then
            echo "ran a binary with a wrong checksum"; exit 1
          fi
          cat err.txt
          grep -q "checksum mismatch" err.txt
          test -z "$(ls -A "$CLAUDE_PLUGIN_DATA/bin")"
