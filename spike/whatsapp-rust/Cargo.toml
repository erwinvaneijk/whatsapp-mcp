[package]
name = "wa-spike"
version = "0.0.0"
edition = "2024"
publish = false
description = "Phase 1 go/no-go test of whatsapp-rust (see docs/rust-1.0/phase1.md)"

[dependencies]
# Pinned to the commit the phase 1 test was written against.
whatsapp-rust = { git = "https://github.com/oxidezap/whatsapp-rust", rev = "52fb6643ba3a97c7271ce6ffe5814c32d47070d8" }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "io-std", "io-util", "sync", "fs"] }
anyhow = "1"
log = "0.4"
env_logger = "0.11"
qrcode = { version = "0.14", default-features = false }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
mime_guess = "2"

[lints.rust]
unsafe_code = "forbid"
