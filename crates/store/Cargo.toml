[package]
name = "whatsapp-mcp-store"
description = "messages.db: schema, migrations, full-text search and queries."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
log = "0.4.35"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
# 0.40, not newer: it links the same libsqlite3-sys (0.38) as whatsapp-rust's
# session store, and a program can link only one SQLite.
rusqlite = { version = "0.40", features = ["bundled", "functions"] }
serde = { version = "1.0.229", features = ["derive"] }


[lints]
workspace = true

[dev-dependencies]
tempfile = "3.27.0"
