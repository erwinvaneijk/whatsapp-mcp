# cargo deny check: the supply-chain checks for the Rust workspace.
# Runs in CI (the "Rust dependencies" job). Locally: cargo install cargo-deny,
# then cargo deny check.

[graph]
all-features = true

# Known vulnerabilities and unmaintained crates, from the RustSec database
# (the same one cargo audit uses).
[advisories]
version = 2
yanked = "deny"
ignore = []

# Only licenses that let us ship a binary under this project's license.
[licenses]
version = 2
confidence-threshold = 0.9
# The list covers what later phases will bring in; no warning for a
# license no dependency uses yet.
unused-allowed-license = "allow"
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    # Mozilla's list of certificate authorities, as data (webpki-roots).
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    # MIT without the attribution requirement (borrow-or-share).
    "MIT-0",
    "Unicode-3.0",
    "Zlib",
]

[licenses.private]
# Our own crates are not published; their license is the repository's.
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Our own crates depend on each other by path, without a version.
allow-wildcard-paths = true

# Crates only from crates.io. A git dependency (such as a pinned
# whatsapp-rust commit) must be added here on purpose.
[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = [
    # The WhatsApp library, pinned to one commit in crates/bridge/Cargo.toml.
    "https://github.com/oxidezap/whatsapp-rust",
]
